<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ev Gereçleri | Dost Pazar</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f7;
  color: #333;
}

header {
  background: #2e7d32;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 5px 0;
  font-size: 16px;
}

nav {
  background: #1b5e20;
  padding: 10px;
  text-align: center;
}

nav a {
  color: white;
  margin: 0 12px;
  text-decoration: none;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 15px;
}

.product-list {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

.product-card {
  width: 260px;
  background: white;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.12);
  text-align: center;
  transition: 0.3s;
}

.product-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.18);
}

.product-card img {
  width: 100%;
  height: 200px;
  object-fit: cover; /* tüm resimler kartta düzgün görünür */
  border-radius: 10px;
  margin-bottom: 10px;
}

.product-card h3 {
  font-size: 20px;
  min-height: 50px; /* farklı başlık uzunlukları hizalı olsun */
}

.price {
  font-size: 18px;
  color: #444;
  min-height: 25px; /* fiyatlar hizalı olsun */
  margin-bottom: 10px;
}

.whatsapp-btn {
  background: #25D366;
  color: white;
  padding: 10px 14px;
  font-size: 16px;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
  display: inline-block;
  transition: 0.2s;
}

.whatsapp-btn:hover {
  background: #1ebe5d;
}

</style>
</head>

<body>

<header>
  <h1>Ev Gereçleri</h1>
  <p>Ev için pratik ve kullanışlı ürünler</p>
</header>

<nav>
  <a href="index.html">← Ana Sayfaya Dön</a>
</nav>

<div class="container">

  <div class="product-list">

    <!-- ÜRÜN: 4 Bölmeli Saklama Kabı -->
    <div class="product-card">
      <img src="images/ev_gerecleri/saklama_kabi/eg_sk_a.png" alt="4 Bölmeli Saklama Kabı">
      <h3>4 Bölmeli Saklama Kabı</h3>
      <p class="price"><strong>50 TL</strong></p>
      <p>Çok Amaçlı Saklama Kutusu</p>
      <a class="whatsapp-btn" 
         href="https://wa.me/905510471653?text=4%20B%C3%B6lmeli%20Saklama%20Kab%C4%B1%20hakk%C4%B1nda%20bilgi%20almak%20istiyorum."
         target="_blank">WhatsApp Sipariş</a>
    </div>

  </div>

</div>

</body>
</html>
